name: publish image

permissions:
  contents: read

on:
  push:
    branches:
      - 'main'
    tags:
      - 'v*'

jobs:
  base:
    uses: docker/github-builder/.github/workflows/build.yml@v1
    permissions:
      contents: read # to fetch the repository content
      id-token: write # for signing attestations and cache entries with GitHub OIDC
    with:
      output: image
      push: true
      platforms: linux/amd64,linux/arm64
      meta-images: |
        docker.io/julieio/agent-devcontainer
      meta-tags: |
        type=ref,event=branch
        type=ref,event=tag
        type=match,pattern=(v\d+)\.\d+,group=1
        type=semver,pattern={{version}}
    secrets:
      registry-auths: |
        - registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

  # Frontend variant (headless Chromium + @playwright/mcp) — see frontend.Dockerfile.
  # needs: base plus pinning BASE_IMAGE to the base job's digest (not :latest) closes
  # a race: without it this job could pull the base image before the base job's push
  # completes, silently building frontend on the *previous* release with no record
  # of the mismatch in either tag.
  frontend:
    needs: base
    uses: docker/github-builder/.github/workflows/build.yml@v1
    permissions:
      contents: read
      id-token: write
    with:
      output: image
      push: true
      platforms: linux/amd64,linux/arm64
      file: frontend.Dockerfile
      build-args: |
        BASE_IMAGE=docker.io/julieio/agent-devcontainer@${{ needs.base.outputs.digest }}
      meta-images: |
        docker.io/julieio/agent-devcontainer
      meta-tags: |
        type=ref,event=branch
        type=ref,event=tag
        type=match,pattern=(v\d+)\.\d+,group=1
        type=semver,pattern={{version}}
      meta-flavor: |
        suffix=-frontend,onlatest=true
    secrets:
      registry-auths: |
        - registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
